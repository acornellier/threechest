name: Sync Rankings

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: yarn install

      # Rehydrates src/data/sampleRoutes/ from the published blobs. queryRankings.ts skips routes
      # whose file already exists, so without this every run re-fetches every fight from WCL.
      - name: Download published rankings
        run: yarn rankings:download

      # No continue-on-error: a partial fetch must not reach the upload step.
      - name: Query rankings
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: yarn r

      - name: Publish rankings
        run: yarn rankings:upload
